<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join LoveLink</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            ❤️ LoveLink
        </div>

        <nav>
            <a href="index.html">Home</a>
        </nav>

    </header>


    <main>

        <section class="registration">

            <div class="registration-box">

                <h1>❤️ Create Your LoveLink Account</h1>

                <p>
                    Join LoveLink and start building meaningful connections.
                </p>


                <form action="profile.html" method="GET">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >


                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="age">Age</label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="18"
                        placeholder="18+"
                        required
                    >


                    <label for="gender">Gender</label>

                    <select id="gender" name="gender" required>

                        <option value="">
                            Select your gender
                        </option>

                        <option value="male">
                            Male
                        </option>

                        <option value="female">
                            Female
                        </option>

                    </select>


                    <label for="location">Location</label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="City / Country"
                        required
                    >


                    <label for="goal">
                        What are you looking for?
                    </label>

                    <select id="goal" name="goal" required>

                        <option value="">
                            Select an option
                        </option>

                        <option value="relationship">
                            Serious relationship
                        </option>

                        <option value="friendship">
                            Friendship
                        </option>

                        <option value="marriage">
                            Marriage
                        </option>

                        <option value="companionship">
                            Companionship
                        </option>

                    </select>


                    <label for="password">
                        Create Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >


                    <label class="age-confirmation">

                        <input
                            type="checkbox"
                            required
                        >

                        I confirm that I am 18 years or older.

                    </label>


                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Continue
                    </button>

                </form>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 LoveLink. All rights reserved.
        </p>

        <p>
            18+ only • Privacy • Terms • Safety
        </p>

    </footer>

</body>

</html>
