<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LoveLink - My Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            ❤️ LoveLink
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="profile.html">My Profile</a>
        </nav>
    </header>


    <main>

        <section class="profile-page">

            <h1>Welcome to LoveLink ❤️</h1>

            <p>
                Your profile is ready. This is your personal space on LoveLink.
            </p>

            <div class="profile-card">

                <!-- Profile Picture -->
                <div class="profile-picture">
                    <img
                        src="https://via.placeholder.com/150"
                        alt="Profile picture"
                    >
                </div>

                <h2>My Profile</h2>

                <p><strong>Name:</strong> LoveLink Member</p>

                <p><strong>Age:</strong> 18+</p>

                <p><strong>Looking for:</strong> Meaningful connection</p>

                <button class="primary-btn" onclick="createPost()">
    Post
</button>


                <!-- Create Post -->
                <div class="post-section">

                    <h2>Create a Post</h2>

                    <textarea
                        placeholder="Share something with your LoveLink community..."
                        rows="4"
                    ></textarea>

                   <input
    type="file"
    id="profileImageInput"
    accept="image/*"
>

                    <button class="primary-btn">
                        Post
                    </button>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 LoveLink. All rights reserved.
        </p>

        <p>
            18+ only • Privacy • Terms • Safety
        </p>

    </footer>
    <script>
    const imageInput = document.querySelector('input[type="file"]');
    const profileImage = document.querySelector('.profile-picture img');

    imageInput.addEventListener('change', function () {
        const file = this.files[0];

        if (file) {
            const imageURL = URL.createObjectURL(file);
            profileImage.src = imageURL;
        }
    });
</script>
    <script>
    function createPost() {
        const textarea = document.querySelector('.post-section textarea');
        const text = textarea.value.trim();

        if (text === '') {
            alert('Please write something before posting.');
            return;
        }

        const post = document.createElement('div');

        post.style.marginTop = '20px';
        post.style.padding = '20px';
        post.style.background = '#fff7fa';
        post.style.borderRadius = '15px';
        post.style.textAlign = 'left';

        post.innerHTML = `
            <strong>LoveLink Member</strong>
            <p style="margin-top:10px;">${text}</p>
        `;

        document.querySelector('.post-section').appendChild(post);

        textarea.value = '';
    }
</script>

</body>

</html>
